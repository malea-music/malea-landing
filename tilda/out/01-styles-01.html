<style>
@font-face {
font-family: "Leotaro";
src: url("__FONT_BASE__/Leotaro-Regular.otf") format("opentype");
font-weight: 400;
font-style: normal;
font-display: swap;
}
@font-face {
font-family: "Circe";
src: url("__FONT_BASE__/circe.ttf") format("truetype");
font-weight: 400;
font-style: normal;
font-display: swap;
}
@font-face {
font-family: "Circe";
src: url("__FONT_BASE__/circe-light.ttf") format("truetype");
font-weight: 300;
font-style: normal;
font-display: swap;
}
:root {
--bg-void: #040812;
--bg-night: #071020;
--bg-deep: #0A1326;
--bg-blue-black: #050B18;
--bg-main: #0A1220;
--ink: #F3EBDD;
--ink-soft: rgba(243, 235, 221, .74);
--ink-muted: rgba(243, 235, 221, .52);
--ink-faint: rgba(243, 235, 221, .32);
--ink-ghost: rgba(243, 235, 221, .12);
--gold: #D8B76C;
--gold-soft: rgba(216, 183, 108, .64);
--gold-line: rgba(216, 183, 108, .28);
--gold-faint: rgba(216, 183, 108, .12);
--blue-mist: rgba(94, 141, 190, .14);
--violet-mist: rgba(117, 91, 171, .10);
--font-display: "Leotaro", "Cormorant Garamond", Georgia, serif;
--font-body: "Circe", "Helvetica Neue", Helvetica, Arial, sans-serif;
--font-quote: "Cormorant Garamond", Georgia, serif;
--fs-display: clamp(82px, 10vw, 152px);
--fs-hero: clamp(64px, 8.6vw, 126px);
--fs-section: clamp(36px, 4.2vw, 60px);
--fs-title: clamp(28px, 3.4vw, 48px);
--fs-subtitle: clamp(19px, 2vw, 28px);
--fs-body: clamp(16px, 1.25vw, 18px);
--fs-micro: clamp(10px, .78vw, 12px);
--s-1: 8px;
--s-2: 12px;
--s-3: 16px;
--s-4: 24px;
--s-5: 32px;
--s-6: 48px;
--s-7: 72px;
--s-8: 96px;
--s-9: 128px;
--s-10: 160px;
--heading-kicker-gap: clamp(14px, 1.6vw, 24px);
--heading-sub-gap: clamp(10px, 1.1vw, 16px);
--heading-copy-gap: clamp(22px, 2.4vw, 36px);
--vr-standard: clamp(100px, 12vh, 180px);
--vr-dense: clamp(72px, 8vh, 120px);
--vr-generous: clamp(140px, 16vh, 220px);
--vr-transitional: clamp(60px, 6vh, 100px);
--page-x: clamp(28px, 6vw, 128px);
--content-max: 1360px;
--content: min(calc(100vw - var(--page-x) * 2), var(--content-max));
--ease-out: cubic-bezier(.16, 1, .3, 1);
--ease-soft: cubic-bezier(.22, .61, .36, 1);
--dur-slow: 1100ms;
--dur-mid: 760ms;
--z-nav: 80;
--z-menu: 90;
--z-modal: 100;
}
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html {
-webkit-text-size-adjust: 100%;
scroll-behavior: smooth;
overflow-x: hidden;
}
body {
font-family: var(--font-body);
font-weight: 300;
font-size: var(--fs-body);
line-height: 1.66;
color: var(--ink);
background: var(--bg-main);
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility;
overflow-x: hidden;
}
body.is-scroll-locked { overflow: hidden; }
.site-atmosphere {
position: fixed;
inset: 0;
z-index: -2;
pointer-events: none;
background:
radial-gradient(ellipse at 50% 5%, rgba(243,235,221,.025) 0%, transparent 50%),
radial-gradient(ellipse at 50% 92%, rgba(94,141,190,.06) 0%, transparent 50%),
linear-gradient(180deg, var(--bg-void) 0%, var(--bg-main) 35%, var(--bg-main) 100%);
}
@media (max-width: 760px) {
.site-atmosphere {
position: absolute;
background:
radial-gradient(ellipse at 50% 5%, rgba(243,235,221,.015) 0%, transparent 50%),
radial-gradient(ellipse at 50% 92%, rgba(94,141,190,.04) 0%, transparent 50%),
linear-gradient(180deg, var(--bg-void) 0%, var(--bg-main) 35%, var(--bg-main) 100%);
}
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
ul, ol { list-style: none; }
::selection { background: var(--gold); color: var(--bg-void); }
h1, h2, h3, h4 { font-weight: 400; text-wrap: balance; }
p { text-wrap: pretty; }
:focus-visible { outline: 1px solid var(--gold-soft); outline-offset: 4px; }
.section {
position: relative;
width: 100%;
}
.wrap {
position: relative;
z-index: 1;
width: var(--content);
max-width: var(--content-max);
margin-inline: auto;
}
.pad-block { padding-block: var(--vr-standard); }
.pad-block--dense { padding-block: var(--vr-dense); }
.pad-block--generous { padding-block: var(--vr-generous); }
.pad-block--transitional { padding-block: var(--vr-transitional); }
.full { min-height: 100svh; }
.overline {
display: inline-flex;
align-items: center;
gap: var(--s-3);
font-size: var(--fs-micro);
letter-spacing: .16em;
text-transform: uppercase;
color: var(--gold-soft);
font-weight: 400;
}
.overline::before {
content: "";
width: clamp(28px, 4vw, 56px);
height: 1px;
background: var(--gold-line);
}
.overline--center::after {
content: "";
width: clamp(28px, 4vw, 56px);
height: 1px;
background: var(--gold-line);
}
.display {
font-family: var(--font-display);
font-size: var(--fs-display);
line-height: .98;
letter-spacing: .03em;
}
.heading {
font-family: var(--font-display);
font-size: var(--fs-section);
line-height: 1.08;
letter-spacing: .01em;
}
.overline + .heading,
.overline + .title {
margin-top: var(--heading-kicker-gap);
}
.heading + .subtitle,
.title + .subtitle {
margin-top: var(--heading-sub-gap);
}
.title {
font-family: var(--font-display);
font-size: var(--fs-title);
line-height: 1.12;
}
.subtitle {
font-size: var(--fs-subtitle);
color: var(--ink-soft);
font-weight: 300;
line-height: 1.4;
}
.lede {
font-size: var(--fs-body);
color: var(--ink-soft);
line-height: 1.7;
max-width: 60ch;
}
.measure { max-width: 36rem; }
.rule {
width: 100%;
height: 1px;
background: var(--gold-line);
border: 0;
}
.rule--short { width: clamp(48px, 8vw, 120px); }
.btn {
display: inline-flex;
align-items: center;
gap: var(--s-3);
padding: 1.05em 2.1em;
font-family: var(--font-body);
font-size: var(--fs-micro);
font-weight: 400;
letter-spacing: .18em;
text-transform: uppercase;
color: var(--ink);
border: 1px solid var(--gold-line);
background: transparent;
position: relative;
overflow: hidden;
isolation: isolate;
transition:
color       .45s var(--ease-soft),
border-color .45s var(--ease-soft),
box-shadow  .45s var(--ease-soft);
}
.btn::after {
content: "";
position: absolute;
inset: -2px;
background: radial-gradient(
ellipse 120% 180% at 50% 130%,
rgba(216, 183, 108, .22)  0%,
rgba(216, 183, 108, .08)  40%,
transparent               68%
);
opacity: 0;
transform: scale(.55) translateY(8px);
transform-origin: 50% 100%;
transition:
opacity   .5s var(--ease-soft),
transform .65s var(--ease-out);
pointer-events: none;
z-index: 0;
}
.btn:hover {
color: var(--gold);
border-color: rgba(216, 183, 108, .52);
box-shadow:
0 0 0 1px rgba(216,183,108,.08),
0 0 22px rgba(216,183,108,.10),
inset 0 0 14px rgba(216,183,108,.04);
}
.btn:hover::after {
opacity: 1;
transform: scale(1) translateY(0);
}
.btn--gold {
border-color: var(--gold-soft);
color: var(--gold);
}
.btn--gold::after {
background: radial-gradient(
ellipse 120% 180% at 50% 130%,
rgba(216, 183, 108, .28)  0%,
rgba(216, 183, 108, .10)  40%,
transparent               68%
);
}
.btn--gold:hover {
border-color: var(--gold);
box-shadow:
0 0 0 1px rgba(216,183,108,.14),
0 0 28px rgba(216,183,108,.16),
inset 0 0 18px rgba(216,183,108,.06);
}
.btn > span {
position: relative;
z-index: 1;
}
.link-arrow {
display: inline-flex;
align-items: center;
gap: var(--s-2);
font-size: var(--fs-micro);
letter-spacing: .14em;
text-transform: uppercase;
color: var(--gold-soft);
transition: gap .4s var(--ease-soft), color .4s var(--ease-soft);
}
.link-arrow:hover { gap: var(--s-4); color: var(--gold); }
.aura {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 0;
}
.nav {
position: fixed;
top: 0;
left: 0;
width: 100%;
z-index: var(--z-nav);
padding-block: var(--s-4);
background: linear-gradient(180deg, rgba(5, 10, 24, .82), rgba(5, 10, 24, 0));
transform: translateY(-100%);
opacity: 0;
transition: transform .7s var(--ease-out), opacity .7s var(--ease-out),
background .5s ease, border-color .5s ease;
border-bottom: 1px solid transparent;
}
.nav.is-visible { transform: translateY(0); opacity: 1; }
html.js-opening .nav {
transition: transform .96s var(--op-ease, var(--ease-out)), opacity .96s var(--op-ease, var(--ease-out)),
background .5s ease, border-color .5s ease;
}
html.opening-nav-visible .nav { transform: translateY(0); opacity: 1; }
.nav.is-solid {
background: rgba(5, 10, 24, .78);
-webkit-backdrop-filter: blur(16px);
backdrop-filter: blur(16px);
border-bottom-color: var(--gold-line);
}
.nav__inner {
width: var(--content);
max-width: var(--content-max);
margin-inline: auto;
display: flex;
align-items: center;
justify-content: space-between;
gap: var(--s-5);
}
.nav__logo {
font-family: var(--font-display);
font-size: clamp(20px, 2vw, 26px);
letter-spacing: .20em;
padding-left: .20em;
color: var(--gold);
}
.nav__links {
display: flex;
align-items: center;
gap: clamp(20px, 2.4vw, 44px);
}
.nav__links a {
font-size: var(--fs-micro);
letter-spacing: .14em;
text-transform: uppercase;
color: var(--ink-muted);
position: relative;
padding-block: 6px;
transition: color .4s var(--ease-soft);
}
.nav__links a::after {
content: "";
position: absolute;
left: 0; bottom: 0;
width: 100%; height: 1px;
background: var(--gold);
transform: scaleX(0);
transform-origin: right;
transition: transform .45s var(--ease-out);
}
.nav__links a:hover { color: var(--ink); }
.nav__links a:hover::after { transform: scaleX(1); transform-origin: left; }
.nav__cta { display: inline-flex; }
.nav__cta .btn { padding: .85em 1.6em; }
.nav__burger {
display: none;
flex-direction: column;
gap: 6px;
width: 40px;
height: 40px;
align-items: center;
justify-content: center;
}
.nav__burger span {
width: 24px; height: 1.5px; border-radius: 2px;
background: var(--ink);
transition: background .4s var(--ease-soft), transform .4s var(--ease-out);
}
.nav__burger:hover span { background: var(--gold); }
.menu {
position: fixed;
inset: 0;
z-index: var(--z-menu);
display: flex;
flex-direction: column;
padding-inline: 0;
padding-block:
max(var(--s-4), env(safe-area-inset-top))
max(var(--s-6), env(safe-area-inset-bottom));
background: var(--bg-night);
opacity: 0;
visibility: hidden;
overflow-y: auto;
overscroll-behavior: contain;
transition: opacity .55s var(--ease-out), visibility .55s;
}
.menu.is-open { opacity: 1; visibility: visible; }
.menu__bg {
position: absolute; inset: 0; z-index: 0; pointer-events: none;
background:
radial-gradient(ellipse 92% 48% at 50% -8%, rgba(94,141,190,.16), transparent 60%),
radial-gradient(ellipse 80% 46% at 50% 108%, rgba(216,183,108,.10), transparent 62%),
linear-gradient(180deg, var(--bg-void) 0%, var(--bg-night) 48%, var(--bg-void) 100%);
}
.menu__bg::after {
content: ""; position: absolute; inset: 0;
background: radial-gradient(ellipse at 50% 46%, transparent 56%, rgba(4,8,18,.55) 100%);
}
.menu__top {
position: relative; z-index: 2; flex: 0 0 auto;
width: var(--content); max-width: var(--content-max);
margin-inline: auto; margin-bottom: clamp(20px, 4vh, 48px);
display: flex; align-items: center; justify-content: space-between;
}
.menu__logo {
font-family: var(--font-display);
font-size: clamp(20px, 2vw, 26px);
letter-spacing: .20em; padding-left: .20em;
color: var(--gold);
}
.menu__close {
position: relative; width: 40px; height: 40px;
border-radius: 50%;
border: 1px solid var(--gold-line);
background: rgba(5, 10, 24, .32);
transition: border-color .4s var(--ease-soft), background .4s var(--ease-soft);
}
.menu__close:hover { border-color: var(--gold-soft); background: rgba(5, 10, 24, .5); }
.menu__close::before, .menu__close::after {
content: ""; position: absolute; top: 50%; left: 50%;
width: 16px; height: 1.5px; background: var(--ink);
transition: background .4s var(--ease-soft);
}
.menu__close::before { transform: translate(-50%, -50%) rotate(45deg); }
.menu__close::after  { transform: translate(-50%, -50%) rotate(-45deg); }
.menu__close:hover::before, .menu__close:hover::after { background: var(--gold); }
.menu__links {
position: relative; z-index: 2;
flex: 0 1 auto; min-height: 0;
width: var(--content); max-width: var(--content-max);
margin: auto;
display: flex; flex-direction: column;
}
.menu__links a {
display: grid;
grid-template-columns: auto 1fr auto;
align-items: baseline;
column-gap: clamp(16px, 5vw, 26px);
padding-block: clamp(15px, 2.3vh, 24px);
border-bottom: 1px solid var(--ink-ghost);
opacity: 0; transform: translateY(12px);
transition: opacity .6s var(--ease-out), transform .6s var(--ease-out);
}
.menu__links a:first-child { border-top: 1px solid var(--ink-ghost); }
.menu__num {
font-family: var(--font-body);
font-size: var(--fs-micro);
letter-spacing: .16em;
color: var(--gold-soft);
font-variant-numeric: tabular-nums;
transition: color .4s var(--ease-soft);
}
.menu__label {
font-family: var(--font-display);
font-size: clamp(30px, 8vw, 40px);
line-height: 1.05; letter-spacing: .015em;
color: var(--ink-soft);
transition: color .4s var(--ease-soft), transform .5s var(--ease-out);
}
.menu__arrow {
position: relative; align-self: center;
width: 20px; height: 8px;
opacity: 0; transform: translateX(-8px);
transition: opacity .4s var(--ease-soft), transform .5s var(--ease-out);
}
.menu__arrow::before {
content: ""; position: absolute; top: 50%; left: 0; right: 4px;
height: 1px; background: var(--gold); transform: translateY(-50%);
}
.menu__arrow::after {
content: ""; position: absolute; top: 50%; right: 3px;
width: 6px; height: 6px;
border-top: 1px solid var(--gold); border-right: 1px solid var(--gold);
transform: translateY(-50%) rotate(45deg);
}
.menu__links a:hover .menu__label,
.menu__links a:focus-visible .menu__label { color: var(--ink); transform: translateX(6px); }
.menu__links a:hover .menu__num,
.menu__links a:focus-visible .menu__num { color: var(--gold); }
.menu__links a:hover .menu__arrow,
.menu__links a:focus-visible .menu__arrow { opacity: 1; transform: translateX(0); }
.menu.is-open .menu__links a { opacity: 1; transform: none; }
.menu.is-open .menu__links a:nth-child(1) { transition-delay: .12s; }
.menu.is-open .menu__links a:nth-child(2) { transition-delay: .18s; }
.menu.is-open .menu__links a:nth-child(3) { transition-delay: .24s; }
.menu.is-open .menu__links a:nth-child(4) { transition-delay: .30s; }
.menu.is-open .menu__links a:nth-child(5) { transition-delay: .36s; }
.menu__foot {
position: relative; z-index: 2; flex: 0 0 auto;
width: var(--content); max-width: var(--content-max);
margin-inline: auto; margin-top: clamp(28px, 5vh, 56px);
display: flex; flex-direction: column; gap: clamp(18px, 3vh, 26px);
opacity: 0; transform: translateY(12px);
transition: opacity .6s var(--ease-out), transform .6s var(--ease-out);
}
.menu.is-open .menu__foot { opacity: 1; transform: none; transition-delay: .34s; }
.menu__cta-btn { width: 100%; justify-content: center; }
@media (prefers-reduced-motion: reduce) {
.menu__links a, .menu__foot { transition: opacity .3s linear; transform: none; }
}
@media (max-width: 980px) {
.nav { padding-top: max(var(--s-4), env(safe-area-inset-top)); }
.nav__links, .nav__cta { display: none; }
.nav__burger { display: flex; }
}
.modal {
position: fixed;
inset: 0;
z-index: var(--z-modal);
display: grid;
place-items: center;
padding: clamp(20px, 5vw, 56px);
background: rgba(5, 10, 24, .80);
-webkit-backdrop-filter: blur(16px);
backdrop-filter: blur(16px);
opacity: 0;
visibility: hidden;
transition: opacity .5s var(--ease-out), visibility .5s;
}
.modal.is-open { opacity: 1; visibility: visible; }
.modal__card {
position: relative;
width: min(100%, 540px);
background:
radial-gradient(ellipse at 0% 0%, rgba(94,141,190,.10), transparent 60%),
var(--bg-deep);
border: 1px solid var(--gold-line);
padding: clamp(32px, 5vw, 56px);
transform: translateY(24px) scale(.98);
opacity: 0;
transition: transform .6s var(--ease-out), opacity .6s var(--ease-out);
}
.modal__title { text-align: center; }
.modal__tg { display: flex; justify-content: center; }
.modal__note { text-align: center; }
.modal.is-open .modal__card { transform: translateY(0) scale(1); opacity: 1; }
.modal__overline { margin-bottom: var(--s-4); }
.modal__title {
font-family: var(--font-display);
font-size: clamp(28px, 4vw, 40px);
line-height: 1.08;
margin-bottom: var(--s-4);
}
.modal__text { color: var(--ink-soft); margin-bottom: var(--s-5); max-width: 44ch; }
.modal__text p + p { margin-top: var(--s-3); }
.modal__note {
font-size: var(--fs-micro);
letter-spacing: .14em;
text-transform: uppercase;
color: var(--ink-faint);
padding-top: var(--s-4);
margin-top: var(--s-5);
border-top: 1px solid var(--ink-ghost);
}
.modal__tg { margin-top: var(--s-4); }
.modal__close {
position: absolute;
top: var(--s-4); right: var(--s-4);
width: 40px; height: 40px;
z-index: calc(var(--z-modal) + 1);
}
.modal__close::before, .modal__close::after {
content: ""; position: absolute; top: 50%; left: 50%;
width: 18px; height: 1px; background: var(--ink-muted);
transition: background .3s ease;
}
.modal__close::before { transform: translate(-50%, -50%) rotate(45deg); }
.modal__close::after { transform: translate(-50%, -50%) rotate(-45deg); }
.modal__close:hover::before, .modal__close:hover::after { background: var(--gold); }
.video-modal {
position: fixed;
inset: 0;
z-index: var(--z-modal);
display: grid;
place-items: center;
padding: clamp(18px, 4vw, 48px);
background: rgba(5, 10, 24, .88);
-webkit-backdrop-filter: blur(20px);
backdrop-filter: blur(20px);
opacity: 0;
visibility: hidden;
transition: opacity .5s var(--ease-out), visibility .5s;
}
.video-modal.is-open { opacity: 1; visibility: visible; }
.video-modal__inner {
position: relative;
width: min(100%, 460px);
max-height: min(92svh, 920px);
}
.video-modal__frame {
position: relative;
width: 100%;
background: var(--bg-main);
overflow: hidden;
border: 1px solid var(--gold-line);
box-shadow: 0 40px 120px rgba(0,0,0,.6);
}
.video-modal__frame--vertical { aspect-ratio: 9 / 16; max-height: 88svh; }
.video-modal__frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-modal__close {
position: absolute;
top: -46px; right: 0;
width: 40px; height: 40px;
}
.video-modal__close::before, .video-modal__close::after {
content: ""; position: absolute; top: 50%; left: 50%;
width: 20px; height: 1px; background: var(--ink-soft);
}
.video-modal__close::before { transform: translate(-50%, -50%) rotate(45deg); }
.video-modal__close::after { transform: translate(-50%, -50%) rotate(-45deg); }
@media (max-width: 760px) {
.video-modal__close { top: -42px; }
.modal__close {
position: fixed;
top: 0;
right: 0;
}
.modal__close::before,
.modal__close::after {
background: var(--ink);
}
}
.video-frame {
position: relative;
width: 100%;
aspect-ratio: 16 / 9;
overflow: hidden;
background: var(--bg-deep);
border: 1px solid var(--ink-ghost);
transition: border-color .6s var(--ease-soft);
}
.video-frame:hover { border-color: var(--gold-line); }
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.media-caption {
display: flex;
align-items: baseline;
gap: var(--s-3);
margin-top: var(--s-3);
min-height: 1.4em;
}
.media-caption__idx {
font-size: var(--fs-micro);
letter-spacing: .14em;
color: var(--gold-soft);
font-variant-numeric: tabular-nums;
}
.media-caption__name {
font-size: clamp(15px, 1.4vw, 19px);
color: var(--ink-soft);
letter-spacing: .01em;
}
.ph {
position: relative;
width: 100%;
overflow: hidden;
background:
repeating-linear-gradient(135deg, rgba(243,235,221,.03) 0 12px, rgba(243,235,221,.05) 12px 24px),
var(--bg-blue-black);
border: 1px solid var(--ink-ghost);
